# Cheshire — the owner's personal 1:1 assistant (Hermes profile "cheshire") at https://cheshire.geekstyle.net
#
#   browser ─CF Access (Zitadel, owner only)─▶ Cloudflare Tunnel ─▶ ingress-nginx ─▶ Open WebUI (this pod)
#      ─▶ bridge sidecar (nginx, 127.0.0.1:8080) ─▶ Hermes API server on k3-node1 192.168.4.101:8642 /p/cheshire/v1
#
# Own memory (Honcho workspace "cheshire"), GitLab as the owner (PAT scope mcp), chat + web + images + schedules,
# no terminal/file. Sorcerer Mickey (default profile) is the Signal group assistant; admin = hermes.geekstyle.net / CLI.
# Same design as ../luna/luna.yaml; see README.md.
#
# Secrets (created by hand, never committed):
#   cheshire-webui-oidc  OAUTH_CLIENT_ID, OAUTH_CLIENT_SECRET (Zitadel app "Cheshire (Open WebUI)", project cheshire), WEBUI_SECRET_KEY
#   cheshire-hermes-api  HERMES_API_KEY (= API_SERVER_KEY in ~/.hermes/profiles/cheshire/.env on node1)
apiVersion: v1
kind: Namespace
metadata:
  name: cheshire
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cheshire-bridge
  namespace: cheshire
data:
  # nginx image runs envsubst on *.template for DEFINED env vars only — $http_* / $sk stay nginx variables
  default.conf.template: |
    map $http_x_openwebui_user_id $cheshire_session_key {
      ""      "cheshire-web:anonymous";
      default "cheshire-web:$http_x_openwebui_user_id";
    }
    server {
      listen 127.0.0.1:8080;
      client_max_body_size 50m;
      location / {
        proxy_pass http://192.168.4.101:8642/p/cheshire/;
        proxy_http_version 1.1;
        proxy_set_header Authorization "Bearer ${HERMES_API_KEY}";
        proxy_set_header X-Hermes-Session-Key $cheshire_session_key;
        proxy_set_header Host 192.168.4.101:8642;
        proxy_buffering off;              # streaming responses
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cheshire-webui-data
  namespace: cheshire
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests: { storage: 5Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cheshire-webui
  namespace: cheshire
  labels: { app: cheshire-webui }
spec:
  replicas: 1
  strategy: { type: Recreate }        # SQLite on a RWO volume
  selector:
    matchLabels: { app: cheshire-webui }
  template:
    metadata:
      labels: { app: cheshire-webui }
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  # node1 = GitLab + Hermes, node4 = Ollama/RKLLaMA RAM
                  - { key: kubernetes.io/hostname, operator: NotIn, values: [k3-node1, k3-node4] }
      containers:
        - name: open-webui
          # v0.11.4 (2026-10-08; was v0.9.5). Upgrades run one-way DB migrations — back up webui.db first.
          image: ghcr.io/open-webui/open-webui@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f   # v0.11.4
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: WEBUI_NAME, value: Cheshire }
            - { name: WEBUI_URL, value: https://cheshire.geekstyle.net }
            - { name: PORT, value: "8081" }                 # 8080 is the bridge
            # backend = the bridge (adds key + per-user session key)
            - { name: ENABLE_OLLAMA_API, value: "false" }
            - { name: OPENAI_API_BASE_URL, value: http://127.0.0.1:8080/v1 }
            - { name: OPENAI_API_KEY, value: injected-by-bridge }
            - { name: ENABLE_FORWARD_USER_INFO_HEADERS, value: "true" }
            - { name: DEFAULT_MODELS, value: claude-opus-5-5 }   # picker: opus/sonnet/haiku 5.5 (openai.api_configs model_ids in webui.db)
            - { name: BYPASS_MODEL_ACCESS_CONTROL, value: "true" }   # only one model exists
            # auth: SSO only (Zitadel project "cheshire")
            - { name: WEBUI_AUTH, value: "true" }
            - { name: ENABLE_OAUTH, value: "true" }          # v0.11 SSO on/off switch (default on; pinned)
            - { name: ENABLE_LOGIN_FORM, value: "false" }
            - { name: ENABLE_SIGNUP, value: "false" }
            - { name: ENABLE_OAUTH_SIGNUP, value: "true" }
            - { name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL, value: "true" }
            - { name: OAUTH_PROVIDER_NAME, value: "Sign in" }
            - { name: OPENID_PROVIDER_URL, value: https://auth.geekstyle.net/.well-known/openid-configuration }
            - { name: OPENID_REDIRECT_URI, value: https://cheshire.geekstyle.net/oauth/oidc/callback }
            - { name: OAUTH_SCOPES, value: openid email profile }
            - { name: DEFAULT_USER_ROLE, value: user }
            # keep the UI a plain chat: Cheshire has its own web search; no code exec / image gen / sharing
            - { name: ENABLE_WEB_SEARCH, value: "false" }
            - { name: ENABLE_IMAGE_GENERATION, value: "false" }
            - { name: ENABLE_CODE_INTERPRETER, value: "false" }
            - { name: ENABLE_CODE_EXECUTION, value: "false" }
            - { name: ENABLE_COMMUNITY_SHARING, value: "false" }
            - { name: ENABLE_API_KEYS, value: "false" }
            - { name: ENABLE_ADMIN_EXPORT, value: "false" }
          envFrom:
            - secretRef: { name: cheshire-webui-oidc }
          volumeMounts:
            - { name: data, mountPath: /app/backend/data }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "1", memory: 1536Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8081 }
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /health, port: 8081 }
            initialDelaySeconds: 180
            periodSeconds: 30
        - name: bridge
          image: nginx:1.29-alpine
          env:
            - name: HERMES_API_KEY
              valueFrom: { secretKeyRef: { name: cheshire-hermes-api, key: HERMES_API_KEY } }
          volumeMounts:
            - { name: bridge-conf, mountPath: /etc/nginx/templates }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: cheshire-webui-data }
        - name: bridge-conf
          configMap: { name: cheshire-bridge }
---
apiVersion: v1
kind: Service
metadata:
  name: cheshire-webui
  namespace: cheshire
spec:
  selector: { app: cheshire-webui }
  ports: [{ name: http, port: 80, targetPort: 8081 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cheshire-webui
  namespace: cheshire
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
    - host: cheshire.geekstyle.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: cheshire-webui, port: { number: 80 } }
