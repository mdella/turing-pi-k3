---
- name: Netplan
  tags: [netplan]
  ansible.builtin.template:
    src: 01-network.yaml.j2
    dest: /etc/netplan/01-network.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Regenerate netplan

- name: Find other active netplan files
  tags: [netplan]
  ansible.builtin.find:
    paths: /etc/netplan
    patterns: "*.yaml"
    excludes: 01-network.yaml
  check_mode: false
  register: extra_netplan

- name: No other active netplan files
  tags: [netplan]
  ansible.builtin.assert:
    that: extra_netplan.matched == 0
    fail_msg: "Unexpected netplan files: {{ extra_netplan.files | map(attribute='path') | list }}"
    quiet: true

- name: Cloud-init leaves the network config alone
  tags: [netplan, cloud_init]
  ansible.builtin.copy:
    src: 99-disable-network-config.cfg
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    owner: root
    group: root
    mode: "0644"

- name: DHCPv6 DUID carries the MAC (Kea routes delegated prefixes by it)
  tags: [ipv6]
  ansible.builtin.copy:
    src: 50-duid-link-layer.conf
    dest: /etc/systemd/networkd.conf.d/50-duid-link-layer.conf
    owner: root
    group: root
    mode: "0644"

- name: Multipath ignores Longhorn's iSCSI devices
  tags: [storage]
  ansible.builtin.copy:
    src: multipath.conf
    dest: /etc/multipath.conf
    owner: root
    group: root
    mode: "0644"

- name: Read installed packages
  tags: [storage]
  ansible.builtin.package_facts:
    manager: apt

- name: Storage packages are installed
  tags: [storage]
  ansible.builtin.assert:
    that: "'open-iscsi' in ansible_facts.packages and 'nfs-common' in ansible_facts.packages"
    fail_msg: Longhorn needs open-iscsi and nfs-common
    quiet: true

- name: Read effective sshd settings
  tags: [ssh]
  ansible.builtin.command: sshd -T
  changed_when: false
  check_mode: false
  register: sshd_t

- name: SSH is keys-only with no root login
  tags: [ssh]
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in sshd_t.stdout_lines"
      - "'kbdinteractiveauthentication no' in sshd_t.stdout_lines"
      - "'permitrootlogin no' in sshd_t.stdout_lines"
      - "'pubkeyauthentication yes' in sshd_t.stdout_lines"
    fail_msg: sshd is not keys-only
    quiet: true

- name: Read swap state
  tags: [k3s]
  ansible.builtin.command: swapon --noheadings --show
  changed_when: false
  check_mode: false
  register: swap

- name: Swap is off
  tags: [k3s]
  ansible.builtin.assert:
    that: swap.stdout == ""
    fail_msg: Swap is on
    quiet: true
