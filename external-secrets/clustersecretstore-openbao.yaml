# Cluster-wide store: any namespace can reference it from an ExternalSecret.
# OpenBao side (openbao/README.md): KV v2 at secret/, kubernetes auth role "external-secrets"
# → policy "external-secrets" = read-only on secret/data/k8s/*. Keep app secrets under
# secret/k8s/<namespace>/<name>.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
