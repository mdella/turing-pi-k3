# Builds the geekstyle Hermes image (upstream nousresearch/hermes-agent, digest-pinned, + local patches/extras/MCP)
# on the in-cluster k3s runner with kaniko (unprivileged, no Docker daemon).
#   MRs:  build only (no push) — proves the base still takes our patches.
#   main: push registry.geekstyle.net/geekstyle/platform/hermes-image:<hermes-version>-<YYYYMMDD>-<sha> (+ :<sha>, :main),
#         then smoke-test it (non-root: version, patches present, extras + bundled Honcho importable, gateway API boots).
# Rolling out is deliberate: bump the tag in turing-pi-k3/hermes/k8s (not automatic).
stages: [build, test]

variables:
  KANIKO_IMAGE: ghcr.io/osscontainertools/kaniko:v1.28.5-debug@sha256:d6d74217dc077acfd3094992e917c357080a2d3fdd1042a49e34e29a7e57c572
  HERMES_VERSION: "0.21.6"   # keep in step with HERMES_BASE in the Dockerfile

.kaniko:
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" > /kaniko/.docker/config.json

build:mr:
  extends: .kaniko
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile Dockerfile --no-push
      --cache=true --cache-repo "$CI_REGISTRY_IMAGE/cache" --snapshot-mode=redo --use-new-run

build:
  extends: .kaniko
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - TAG="$HERMES_VERSION-$(date -u +%Y%m%d)-$CI_COMMIT_SHORT_SHA"
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile Dockerfile
      --destination "$CI_REGISTRY_IMAGE:$TAG" --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE:main"
      --cache=true --cache-repo "$CI_REGISTRY_IMAGE/cache" --snapshot-mode=redo --use-new-run
    - echo "Pushed $CI_REGISTRY_IMAGE:$TAG"

smoke:
  stage: test
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  image:
    name: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
    HOME: /tmp/smoke-home
    HERMES_HOME: /tmp/smoke-home/.hermes
    HERMES_WRITE_SAFE_ROOT: /tmp/smoke-home/.hermes
    API_SERVER_ENABLED: "true"
    API_SERVER_HOST: 127.0.0.1
    API_SERVER_PORT: "8642"
    API_SERVER_KEY: smoke-test-not-a-secret
  script:
    - id && test "$(id -u)" = 1000
    - hermes_version=$(python -m hermes_cli.main --version | head -1) && echo "$hermes_version" && echo "$hermes_version" | grep -q "v$HERMES_VERSION"
    - grep -q _GroupObserver /opt/hermes/gateway/platforms/signal.py
    - grep -q TERMINAL_SSH_SYNC_BACK /opt/hermes/tools/environments/ssh.py
    - cat /opt/hermes/plugins/memory/honcho/BUNDLED
    - python -c 'import honcho, ddgs, edge_tts, boto3, markdown, mcp; from plugins.memory import load_memory_provider; assert type(load_memory_provider("honcho")).__name__ == "HonchoMemoryProvider"; print("extras + honcho ok")'
    - cat /opt/geekstyle/local-mcp/render/vendor/VERSION && python -I -c 'import ast,sys; [ast.parse(open(f).read()) for f in sys.argv[1:]]; print("mcp scripts parse")' /opt/geekstyle/local-mcp/*.py
    - mkdir -p "$HERMES_HOME" && (python -m hermes_cli.main gateway run > /tmp/gw.log 2>&1 &)
    - 'for i in $(seq 1 60); do curl -sf -H "Authorization: Bearer $API_SERVER_KEY" http://127.0.0.1:8642/v1/models && break; sleep 2; done; echo'
    - 'curl -sf -H "Authorization: Bearer $API_SERVER_KEY" http://127.0.0.1:8642/v1/models | grep -q hermes-agent || { tail -40 /tmp/gw.log; exit 1; }'

# signal-cli daemon image (signal-cli/Dockerfile) → $CI_REGISTRY_IMAGE/signal-cli; only when that directory changes.
build-signal:mr:
  extends: .kaniko
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [signal-cli/**/*]
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR/signal-cli" --dockerfile "$CI_PROJECT_DIR/signal-cli/Dockerfile" --no-push

build-signal:
  extends: .kaniko
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [signal-cli/**/*]
  script:
    - V=$(sed -n 's/^ARG SIGNAL_CLI_VERSION=//p' signal-cli/Dockerfile)
    - TAG="$V-$(date -u +%Y%m%d)-$CI_COMMIT_SHORT_SHA"
    - /kaniko/executor --context "$CI_PROJECT_DIR/signal-cli" --dockerfile "$CI_PROJECT_DIR/signal-cli/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE/signal-cli:$TAG" --destination "$CI_REGISTRY_IMAGE/signal-cli:main"
    - echo "Pushed $CI_REGISTRY_IMAGE/signal-cli:$TAG"

smoke-signal:
  stage: test
  needs: [build-signal]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [signal-cli/**/*]
  image:
    name: $CI_REGISTRY_IMAGE/signal-cli:main
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  script:
    - id && test "$(id -u)" = 1000
    - signal-cli --version
    - test -s /opt/signal-cli/native/libsignal_jni.so

# SSH tool sandbox image (sandbox/Dockerfile) → $CI_REGISTRY_IMAGE/sandbox; only when that directory changes.
build-sandbox:mr:
  extends: .kaniko
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [sandbox/**/*]
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR/sandbox" --dockerfile "$CI_PROJECT_DIR/sandbox/Dockerfile" --no-push

build-sandbox:
  extends: .kaniko
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [sandbox/**/*]
  script:
    - TAG="$(date -u +%Y%m%d)-$CI_COMMIT_SHORT_SHA"
    - /kaniko/executor --context "$CI_PROJECT_DIR/sandbox" --dockerfile "$CI_PROJECT_DIR/sandbox/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE/sandbox:$TAG" --destination "$CI_REGISTRY_IMAGE/sandbox:main"
    - echo "Pushed $CI_REGISTRY_IMAGE/sandbox:$TAG"

smoke-sandbox:
  stage: test
  needs: [build-sandbox]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [sandbox/**/*]
  image:
    name: $CI_REGISTRY_IMAGE/sandbox:main
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  script:
    - id && test "$(id -u)" = 1000
    - /usr/sbin/sshd -T -f /etc/ssh/sshd_config -o HostKey=/dev/null 2>/dev/null | grep -E "^(port|passwordauthentication|allowtcpforwarding|permitrootlogin) " || true
    - python3 -c 'import docx, pptx, openpyxl, pypdf, matplotlib; print("doc tools ok")'
    - git lfs version   # Obsidian vault sync (vault-sync sidecar) stores images/PDFs via LFS
    - tesseract --version | head -1 && tesseract --list-langs | grep -qx eng && ocrmypdf --version
    # OCR round trip: text PDF → rasterised + OCR'd by ocrmypdf → the word comes back out of the new text layer
    - cd /tmp && python3 -c 'from reportlab.pdfgen import canvas; c=canvas.Canvas("ocr-in.pdf"); c.setFont("Helvetica",36); c.drawString(72,700,"Cheshire smoke test"); c.save()'
    - ocrmypdf --force-ocr --output-type pdf -q ocr-in.pdf ocr-out.pdf && pdftotext ocr-out.pdf - | grep -qi cheshire && echo "ocr ok"
    - "! command -v sudo"

# Render service image (render/Dockerfile) → $CI_REGISTRY_IMAGE/render; only when that directory changes.
build-render:mr:
  extends: .kaniko
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [render/**/*]
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR/render" --dockerfile "$CI_PROJECT_DIR/render/Dockerfile" --no-push

build-render:
  extends: .kaniko
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [render/**/*]
  script:
    - TAG="$(date -u +%Y%m%d)-$CI_COMMIT_SHORT_SHA"
    - /kaniko/executor --context "$CI_PROJECT_DIR/render" --dockerfile "$CI_PROJECT_DIR/render/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE/render:$TAG" --destination "$CI_REGISTRY_IMAGE/render:main"
    - echo "Pushed $CI_REGISTRY_IMAGE/render:$TAG"

smoke-render:
  stage: test
  needs: [build-render]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [render/**/*]
  image:
    name: $CI_REGISTRY_IMAGE/render:main
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  script:
    - id && test "$(id -u)" = 1000
    - chromium-browser --version && test -s /vendor/mermaid.min.js
    - python3 -c 'import ast; ast.parse(open("/usr/local/bin/render-server").read()); print("server parses")'
