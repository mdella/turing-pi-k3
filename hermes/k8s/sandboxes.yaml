# Per-profile tool sandboxes for Cheshire and Luna (Hermes terminal backend "ssh"; design + test: ../sandbox/ssh/).
# Replaces node1's `docker run` sandboxes. Each profile: its own pod, its own key (authorized only here), its own
# workspace + GnuPG volumes. No egress at all, SSH in from the gateway pod only (NetworkPolicy in network.yaml).
# replicas: 0 until cutover (the docker sandboxes on node1 are still in use; their /workspace and gnupg are copied in).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: sbx-cheshire-data, namespace: hermes }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: sbx-luna-data, namespace: hermes }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbx-cheshire
  namespace: hermes
  labels: { app.kubernetes.io/name: hermes-sandbox, hermes.geekstyle.net/sandbox: cheshire }
spec:
  replicas: 0
  strategy: { type: Recreate }
  selector: { matchLabels: { hermes.geekstyle.net/sandbox: cheshire } }
  template:
    metadata: { labels: { app.kubernetes.io/name: hermes-sandbox, hermes.geekstyle.net/sandbox: cheshire } }
    spec:
      imagePullSecrets: [{ name: registry-pull }]
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      tolerations:
        - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
      containers:
        - name: sandbox
          image: registry.geekstyle.net/geekstyle/platform/hermes-image/sandbox:20261011-838e511c
          ports: [{ name: ssh, containerPort: 2222 }]
          readinessProbe:
            tcpSocket: { port: 2222 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "2", memory: 2Gi, ephemeral-storage: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /workspace, subPath: workspace }
            - { name: data, mountPath: /home/sandbox/.gnupg, subPath: gnupg }
            - { name: home, mountPath: /home/sandbox }
            - { name: tmp, mountPath: /tmp }
            - { name: run, mountPath: /run }
            - { name: keys, mountPath: /etc/sandbox-ssh/hostkey/ssh_host_ed25519_key, subPath: ssh_host_ed25519_key, readOnly: true }
            - { name: keys, mountPath: /etc/sandbox-ssh/authorized/authorized_keys, subPath: authorized_keys, readOnly: true }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: sbx-cheshire-data } }
        - { name: home, emptyDir: { sizeLimit: 1Gi } }
        - { name: tmp, emptyDir: { sizeLimit: 512Mi } }
        - { name: run, emptyDir: { medium: Memory, sizeLimit: 16Mi } }
        - { name: keys, secret: { secretName: sbx-cheshire-ssh } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbx-luna
  namespace: hermes
  labels: { app.kubernetes.io/name: hermes-sandbox, hermes.geekstyle.net/sandbox: luna }
spec:
  replicas: 0
  strategy: { type: Recreate }
  selector: { matchLabels: { hermes.geekstyle.net/sandbox: luna } }
  template:
    metadata: { labels: { app.kubernetes.io/name: hermes-sandbox, hermes.geekstyle.net/sandbox: luna } }
    spec:
      imagePullSecrets: [{ name: registry-pull }]
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      tolerations:
        - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
      containers:
        - name: sandbox
          image: registry.geekstyle.net/geekstyle/platform/hermes-image/sandbox:20261011-838e511c
          ports: [{ name: ssh, containerPort: 2222 }]
          readinessProbe:
            tcpSocket: { port: 2222 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "2", memory: 2Gi, ephemeral-storage: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /workspace, subPath: workspace }
            - { name: data, mountPath: /home/sandbox/.gnupg, subPath: gnupg }
            - { name: home, mountPath: /home/sandbox }
            - { name: tmp, mountPath: /tmp }
            - { name: run, mountPath: /run }
            - { name: keys, mountPath: /etc/sandbox-ssh/hostkey/ssh_host_ed25519_key, subPath: ssh_host_ed25519_key, readOnly: true }
            - { name: keys, mountPath: /etc/sandbox-ssh/authorized/authorized_keys, subPath: authorized_keys, readOnly: true }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: sbx-luna-data } }
        - { name: home, emptyDir: { sizeLimit: 1Gi } }
        - { name: tmp, emptyDir: { sizeLimit: 512Mi } }
        - { name: run, emptyDir: { medium: Memory, sizeLimit: 16Mi } }
        - { name: keys, secret: { secretName: sbx-luna-ssh } }
---
apiVersion: v1
kind: Service
metadata: { name: sbx-cheshire, namespace: hermes }
spec:
  selector: { hermes.geekstyle.net/sandbox: cheshire }
  ports: [{ name: ssh, port: 22, targetPort: 2222 }]
---
apiVersion: v1
kind: Service
metadata: { name: sbx-luna, namespace: hermes }
spec:
  selector: { hermes.geekstyle.net/sandbox: luna }
  ports: [{ name: ssh, port: 22, targetPort: 2222 }]
