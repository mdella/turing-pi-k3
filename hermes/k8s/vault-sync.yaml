# Obsidian vaults for Cheshire and Luna (2026-10-15). Each person's vault is a private GitLab repo
# (geekstyle/members/cheshire/vault = Marcos, geekstyle/members/ladyofkrypton/vault = Anna). A `vault-sync` sidecar in
# the profile's sandbox pod keeps it in sync; the agent sees only the work tree, at Obsidian's default path
# "~/Documents/Obsidian Vault", which Hermes's built-in `obsidian` skill uses when OBSIDIAN_VAULT_PATH is unset.
#   - git dir (/git, PVC subPath vault-git) and the push token (Secret sbx-<profile>-vault, a project access token,
#     write_repository, that repo only, expires 2027-10-14) are mounted in the sidecar only: the agent can't read the
#     token or plant hooks/config that the sidecar would run.
#   - every minute: commit the agent's edits, fetch, rebase onto origin/main, push (LFS objects first, see below). On a rebase conflict the agent's
#     version goes to branch conflict/<UTC time> and main keeps the human's version.
#   - Git LFS (2026-10-17): each vault's .gitattributes sends images, PDFs, audio and video to LFS; the sandbox image
#     has git-lfs and the script sets the LFS filters/endpoint itself. Tested both directions (agent → GitLab LFS,
#     GitLab LFS → agent sees the real file).
#   - network: the sandboxes otherwise have no egress; NetworkPolicy below allows GitLab :80 only, and no DNS (the
#     GitLab Service IP is pinned with hostAliases in sandboxes.yaml).
---
apiVersion: v1
kind: ConfigMap
metadata: { name: vault-sync, namespace: hermes }
data:
  vault-sync.sh: |
    #!/bin/sh
    set -u
    export GIT_DIR=/git/vault GIT_WORK_TREE=/vault HOME=/tmp/vault-sync GIT_TERMINAL_PROMPT=0
    mkdir -p "$HOME"
    printf '#!/bin/sh\ncase "$1" in Username*) echo vault-sync;; *) cat /etc/vault-sync/token;; esac\n' > "$HOME/askpass"
    chmod 700 "$HOME/askpass"; export GIT_ASKPASS="$HOME/askpass"
    log() { echo "$(date -u +%FT%TZ) $*"; }
    # Git LFS (images, PDFs, video per the vault's .gitattributes) when the image has git-lfs. Filters, the LFS endpoint
    # and the href rewrite (GitLab returns https://scm.geekstyle.net object links; only the in-cluster address is
    # reachable from here) are all set on the command line, so the vault's own .lfsconfig/.git config can't override them.
    # lfs.storage is pinned to /git (git-lfs otherwise put its object store in the work tree, i.e. into the vault).
    if command -v git-lfs >/dev/null 2>&1; then
      LFS=1
      g() { git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c user.name="$VAULT_AUTHOR" -c user.email="$VAULT_EMAIL" \
              -c filter.lfs.clean="git-lfs clean -- %f" -c filter.lfs.smudge="git-lfs smudge -- %f" \
              -c filter.lfs.process="git-lfs filter-process" -c filter.lfs.required=true \
              -c lfs.url="$VAULT_URL/info/lfs" -c lfs.storage=/git/lfs -c lfs.transfer.enablehrefrewrite=true \
              -c url."http://gitlab.gitlab.svc.cluster.local/".insteadOf="https://scm.geekstyle.net/" "$@"; }
      log "git-lfs $(git-lfs version | cut -d' ' -f1 | cut -d/ -f2) enabled"
    else
      LFS=0
      g() { git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c user.name="$VAULT_AUTHOR" -c user.email="$VAULT_EMAIL" "$@"; }
    fi

    if [ ! -f "$GIT_DIR/HEAD" ]; then
      g init -q -b main && g config core.bare false && g remote add origin "$VAULT_URL"
      until g fetch -q origin main; do log "initial fetch failed, retrying"; sleep 30; done
      if [ -z "$(ls -A /vault)" ]; then g reset -q --hard origin/main; else g reset -q origin/main; fi
      log "initialised from $VAULT_URL"
    fi

    while :; do
      g add -A
      g diff --cached --quiet || { g commit -q -m "$VAULT_AUTHOR: $(date -u +%FT%TZ)" && log committed; }
      if g fetch -q origin main; then
        if ! g rebase -q origin/main >/dev/null 2>&1; then
          g rebase --abort
          b="conflict/$(date -u +%Y%m%dT%H%M%SZ)"
          [ "$LFS" = 0 ] || g lfs push origin HEAD >/dev/null 2>&1
          g push -q origin "HEAD:refs/heads/$b" && log "conflict: agent version saved to $b"
          g reset -q --hard origin/main
        fi
        if [ "$(g rev-parse HEAD)" != "$(g rev-parse origin/main)" ]; then
          [ "$LFS" = 0 ] || g lfs push origin HEAD >/dev/null 2>&1 || log "lfs push failed"   # objects first (no pre-push hook)
          g push -q origin HEAD:main && log pushed
        fi
      else
        log "fetch failed"
      fi
      sleep "${VAULT_SYNC_INTERVAL:-60}"
    done
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: hermes-sandboxes-vault-sync, namespace: hermes }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: hermes-sandbox } }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: gitlab } }
          podSelector: { matchLabels: { app: gitlab } }
      ports: [{ port: 80, protocol: TCP }]
