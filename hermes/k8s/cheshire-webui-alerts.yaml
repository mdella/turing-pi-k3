# Cheshire's scheduled-job results → her Open WebUI chat "Cheshire alerts" (since 2026-11-28). Script:
# ../bin/cheshire-webui-alerts.py (why Hermes can't push there itself, and what it forwards).
#
# The script ships as a ConfigMap, built from the file (no image rebuild):
#   kubectl -n hermes create configmap cheshire-webui-alerts --from-file=../bin/cheshire-webui-alerts.py \
#     --dry-run=client -o yaml | kubectl apply -f -
# The Open WebUI API key (owner's account) lives in OpenBao at secret/k8s/hermes/cheshire-webui-alerts, field
# api_key (written by the owner with ../bin/set-cheshire-webui-alerts-key); External Secrets syncs it here.
#
# The job mounts only profiles/cheshire/cron of the RWO state volume, hence the podAffinity to the hermes pod.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: cheshire-webui-alerts, namespace: hermes }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: cheshire-webui-alerts, creationPolicy: Owner }
  dataFrom:
    - extract: { key: k8s/hermes/cheshire-webui-alerts }
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: cheshire-webui-alerts, namespace: hermes }
spec:
  schedule: "*/10 * * * *"
  timeZone: Etc/UTC
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels: { app.kubernetes.io/name: hermes-timer }
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets: [{ name: registry-pull }]
          enableServiceLinks: false
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector: { matchLabels: { app.kubernetes.io/name: hermes } }
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: forward
              image: registry.geekstyle.net/geekstyle/platform/hermes-image:0.22.5-20261104-7c9c8df9
              command: [/opt/hermes/.venv/bin/python, -I, /opt/alerts/cheshire-webui-alerts.py]
              env:
                - { name: CHESHIRE_HOME, value: /data }
                - name: OWUI_API_KEY
                  valueFrom: { secretKeyRef: { name: cheshire-webui-alerts, key: api_key } }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
              volumeMounts:
                - { name: state, mountPath: /data/cron, subPath: profiles/cheshire/cron }
                - { name: script, mountPath: /opt/alerts, readOnly: true }
          volumes:
            - { name: state, persistentVolumeClaim: { claimName: hermes-state } }
            - { name: script, configMap: { name: cheshire-webui-alerts } }
