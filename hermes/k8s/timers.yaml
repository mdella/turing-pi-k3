# node1's systemd timers as CronJobs (ns hermes). ACTIVE since the cutover (2026-10-11): suspend: false matches the
# live cluster, so re-applying this file changes nothing. k8s/rollback.sh suspends them (they need the gateway's state
# volume and signal-cli). Secret hermes-timers (out of band): owner_uuid, alert_to (owner's Signal UUID), age_recipient
# (age public key for the signal-cli backups; the private key stays in Secret signal-cli-backup-key).
#
# The state and signal-cli volumes are ReadWriteOnce: a job mounting one must run on the node where that volume is
# attached — hence the required podAffinity to the hermes / signal-cli pod.
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: hermes-allowlist-sync, namespace: hermes }
---
# The allowlist sync restarts the gateway after changing the allowlist (was `systemctl restart hermes-gateway`).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: hermes-restart, namespace: hermes }
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [hermes]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: hermes-allowlist-sync, namespace: hermes }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: hermes-restart }
subjects: [{ kind: ServiceAccount, name: hermes-allowlist-sync, namespace: hermes }]
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: hermes-allowlist-sync, namespace: hermes }
spec:
  schedule: "*/10 * * * *"
  timeZone: Etc/UTC
  suspend: false                  # active since cutover 2026-10-11 (rollback.sh: true)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels: { app.kubernetes.io/name: hermes-timer, hermes.geekstyle.net/signal-client: "true" }
        spec:
          restartPolicy: Never
          serviceAccountName: hermes-allowlist-sync
          imagePullSecrets: [{ name: registry-pull }]
          enableServiceLinks: false
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector: { matchLabels: { app.kubernetes.io/name: hermes } }
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: sync
              image: registry.geekstyle.net/geekstyle/platform/hermes-image:0.21.6-20261011-bdc87cea
              # Wait 10 s first: kube-router adds a new pod's IP to the signal-cli NetworkPolicy's allowed-source
              # ipset ~2 s after start; calling earlier gets "Connection refused" (failed every run 2026-10-12).
              # The image has no `sleep`, hence python. Remove once the script retries itself (next image build).
              command: [/opt/hermes/.venv/bin/python, -c, "import time,runpy; time.sleep(10); runpy.run_path('/opt/geekstyle/bin/signal-allowlist-sync.py', run_name='__main__')"]
              env:
                - { name: SIGNAL_RPC, value: "http://signal-cli.hermes.svc.cluster.local:8093/api/v1/rpc" }
                - { name: RESTART_MODE, value: k8s }
                - name: OWNER_UUID
                  valueFrom: { secretKeyRef: { name: hermes-timers, key: owner_uuid } }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 256Mi } }
              volumeMounts:
                - { name: state, mountPath: /home/ubuntu/.hermes }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - { name: state, persistentVolumeClaim: { claimName: hermes-state } }
            - { name: tmp, emptyDir: {} }
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: hermes-dm-cost-alert, namespace: hermes }
spec:
  schedule: "0 * * * *"
  timeZone: Etc/UTC
  suspend: false                  # active since cutover 2026-10-11 (rollback.sh: true)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels: { app.kubernetes.io/name: hermes-timer, hermes.geekstyle.net/signal-client: "true" }
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets: [{ name: registry-pull }]
          enableServiceLinks: false
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector: { matchLabels: { app.kubernetes.io/name: hermes } }
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: alert
              image: registry.geekstyle.net/geekstyle/platform/hermes-image:0.21.6-20261011-bdc87cea
              # 10 s delay: same NetworkPolicy ipset race as allowlist-sync (it messages via signal-cli).
              command: [/opt/hermes/.venv/bin/python, -c, "import time,runpy; time.sleep(10); runpy.run_path('/opt/geekstyle/bin/dm-cost-alert.py', run_name='__main__')"]
              env:
                - { name: SIGNAL_RPC, value: "http://signal-cli.hermes.svc.cluster.local:8093/api/v1/rpc" }
                - { name: DM_DAY_USD, value: "5" }
                - { name: DM_30D_USD, value: "30" }
                - name: ALERT_TO
                  valueFrom: { secretKeyRef: { name: hermes-timers, key: alert_to } }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 256Mi } }
              volumeMounts:
                - { name: state, mountPath: /home/ubuntu/.hermes }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - { name: state, persistentVolumeClaim: { claimName: hermes-state } }
            - { name: tmp, emptyDir: {} }
---
# Nightly encrypted signal-cli backup, straight onto the replicated Longhorn PVC signal-cli-backups (replaces node1's
# signal-cli-backup.timer + /var/backups + the signal-cli-backup-offnode copy job).
apiVersion: batch/v1
kind: CronJob
metadata: { name: signal-cli-backup, namespace: hermes }
spec:
  schedule: "10 3 * * *"
  timeZone: Etc/UTC
  suspend: false                  # active since cutover 2026-10-11 (signal-cli-backup-offnode is suspended)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels: { app.kubernetes.io/name: hermes-timer }
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets: [{ name: registry-pull }]
          enableServiceLinks: false
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector: { matchLabels: { app.kubernetes.io/name: signal-cli } }
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: backup
              image: registry.geekstyle.net/geekstyle/platform/hermes-image/signal-cli:0.14.8-20261011-cea7297b
              command: [/usr/local/bin/signal-cli-backup]
              env:
                - { name: SIGNAL_DATA, value: /data/data }
                - { name: BACKUP_DIR, value: /backups }
                - name: AGE_RECIPIENT
                  valueFrom: { secretKeyRef: { name: hermes-timers, key: age_recipient } }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: 256Mi } }
              volumeMounts:
                - { name: data, mountPath: /data }
                - { name: backups, mountPath: /backups }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - { name: data, persistentVolumeClaim: { claimName: signal-cli-data } }
            - { name: backups, persistentVolumeClaim: { claimName: signal-cli-backups } }
            - { name: tmp, emptyDir: {} }
