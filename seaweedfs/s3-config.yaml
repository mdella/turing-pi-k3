# SeaweedFS S3 configuration
# Creates the S3 credentials secret and exposes S3 via LoadBalancer.
# Identities (2026-10-08): admin (break-glass / legacy apps), hermes-cheshire + hermes-luna (own bucket + hermes-shared,
# action:bucket scoping), owner (the owner's personal full-access key, kept on node1 in ~/.s3-owner). The filer reads
# this file at start: after changing the Secret, `kubectl -n seaweedfs rollout restart sts/seaweedfs-filer`.
---
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-config
  namespace: seaweedfs
type: Opaque
stringData:
  seaweedfs_s3_config: |
    {
      "identities": [
        {
          "name": "admin",
          "credentials": [
            {
              "accessKey": "<CHANGE_ME: S3 access key — use a 32-char hex string, e.g. openssl rand -hex 16>",
              "secretKey": "<CHANGE_ME: S3 secret key — use a 48-char hex string, e.g. openssl rand -hex 24>"
            }
          ],
          "actions": [
            "Admin",
            "Read",
            "Write",
            "List",
            "Tagging"
          ]
        },
        {
          "name": "hermes-cheshire",
          "credentials": [
            {
              "accessKey": "<CHANGE_ME: 20 chars A-Z0-9>",
              "secretKey": "<CHANGE_ME: openssl rand -hex 24>"
            }
          ],
          "actions": [
            "Read:hermes-cheshire",
            "Write:hermes-cheshire",
            "List:hermes-cheshire",
            "Tagging:hermes-cheshire",
            "Read:hermes-shared",
            "Write:hermes-shared",
            "List:hermes-shared",
            "Tagging:hermes-shared"
          ]
        },
        {
          "name": "hermes-luna",
          "credentials": [
            {
              "accessKey": "<CHANGE_ME: 20 chars A-Z0-9>",
              "secretKey": "<CHANGE_ME: openssl rand -hex 24>"
            }
          ],
          "actions": [
            "Read:hermes-luna",
            "Write:hermes-luna",
            "List:hermes-luna",
            "Tagging:hermes-luna",
            "Read:hermes-shared",
            "Write:hermes-shared",
            "List:hermes-shared",
            "Tagging:hermes-shared"
          ]
        },
        {
          "name": "owner",
          "credentials": [
            {
              "accessKey": "<CHANGE_ME: 20 chars A-Z0-9>",
              "secretKey": "<CHANGE_ME: openssl rand -hex 24>"
            }
          ],
          "actions": [
            "Admin",
            "Read",
            "Write",
            "List",
            "Tagging"
          ]
        }
      ]
    }
---
# External LoadBalancer for S3 access (single-stack IPv4 for MetalLB)
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3-external
  namespace: seaweedfs
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.4.208
spec:
  selector:
    app.kubernetes.io/component: filer
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
  type: LoadBalancer
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
