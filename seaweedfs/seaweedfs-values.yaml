# Deployed chart: seaweedfs 4.47.0 (image chrislusf/seaweedfs:4.47) since 2026-09-25, see UPGRADE-4.47.md.
# Upgrade with --reset-then-reuse-values (not --reuse-values) when changing chart versions.
global:
  seaweedfs:
    enableReplication: true
    replicationPlacement: "001"

master:
  replicas: 3
  defaultReplication: "001"
  data:
    type: "hostPath"
    hostPathPrefix: /data/seaweedfs/master
  logs:
    type: "hostPath"
    hostPathPrefix: /data/seaweedfs/master-logs
  # Was node-role.kubernetes.io/control-plane (= only node1-3). When node2 died (2026-05-18)
  # master-1 and filer-2 had nowhere to run. Now a dedicated label on node1, node3, node4
  # (+ node2 if it returns):  kubectl label node <node> seaweedfs-control=true
  nodeSelector: |
    seaweedfs-control: "true"

filer:
  replicas: 3
  data:
    type: "hostPath"
    hostPathPrefix: /data/seaweedfs/filer
  logs:
    type: "hostPath"
    hostPathPrefix: /data/seaweedfs/filer-logs
  nodeSelector: |
    seaweedfs-control: "true"
  extraEnvironmentVars:
    # Use MariaDB via ProxySQL for shared filer metadata across all replicas.
    # ProxySQL provides connection pooling, Galera-aware routing, and a single
    # endpoint regardless of which Galera node is the active writer.
    WEED_MYSQL_ENABLED: "true"
    WEED_MYSQL_HOSTNAME: "proxysql.mariadb.svc.cluster.local"
    WEED_MYSQL_PORT: "6033"
    WEED_MYSQL_DATABASE: "seaweedfs"
    WEED_MYSQL_USERNAME: "seaweedfs"
    # CHANGE_ME: must match mariadb-galera.yaml mariadb-seaweedfs secret and proxysql.yaml mysql_users password
    WEED_MYSQL_PASSWORD: "<CHANGE_ME: seaweedfs DB user password>"
    WEED_MYSQL_CONNECTION_MAX_IDLE: "5"
    WEED_MYSQL_CONNECTION_MAX_OPEN: "75"
    WEED_MYSQL_CONNECTION_MAX_LIFETIME_SECONDS: "600"
    WEED_MYSQL_INTERPOLATEPARAMS: "true"
    # LevelDB2 disabled — MariaDB is the filer metadata store
    WEED_LEVELDB2_ENABLED: "false"
    WEED_FILER_OPTIONS_RECURSIVE_DELETE: "false"
    WEED_FILER_BUCKETS_FOLDER: "/buckets"

  s3:
    enabled: true
    port: 8333
    enableAuth: true
    existingConfigSecret: seaweedfs-s3-config

volume:
  # One volume server per node (anti-affinity) = 4. Ran with 3 while node2 was down (2026-05-18 → 2026-09-26);
  # back to 4 on 2026-09-26 after node2 was reinstalled (volume-3 on k3-node2).
  replicas: 4
  dataDirs:
    - name: data1
      type: "hostPath"
      hostPathPrefix: /data/seaweedfs/volume
      maxVolumes: 0
  logs:
    type: "hostPath"
    hostPathPrefix: /data/seaweedfs/volume-logs
