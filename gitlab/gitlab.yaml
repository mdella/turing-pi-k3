---
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
  namespace: gitlab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3-node1
      containers:
        - name: gitlab
          # Pinned — upgrade deliberately, stepping through required stops
          # (x.2/x.5/x.8/x.11, latest patch of each): https://docs.gitlab.com/update/upgrade_paths/
          image: gitlab/gitlab-ce:19.3.3-ce.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
            - name: ssh
              containerPort: 22
          env:
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                # Public via Cloudflare Tunnel (TLS terminates at Cloudflare; cloudflared →
                # ingress-nginx → this pod over plain HTTP). See cloudflare/README.md.
                external_url 'https://scm.geekstyle.net'
                nginx['listen_port'] = 80
                nginx['listen_https'] = false
                letsencrypt['enable'] = false
                # Real client IPs: Cloudflare sets CF-Connecting-IP; trust only pod-network hops
                nginx['real_ip_header'] = 'CF-Connecting-IP'
                nginx['real_ip_recursive'] = 'on'
                nginx['real_ip_trusted_addresses'] = ['10.42.0.0/16', 'fd10:42::/56']
                gitlab_rails['trusted_proxies'] = ['10.42.0.0/16', 'fd10:42::/56']
                # Git over SSH stays internal (LAN/netbird); public git uses HTTPS + tokens
                gitlab_rails['gitlab_shell_ssh_port'] = 2222
                # SSO via Zitadel (auth.geekstyle.net, which federates Google). Client id/secret
                # come from Secret gitlab-oidc (envFrom). Zitadel only issues tokens to users
                # holding a role in project "scm" (GitLab only, since 2026-10-08); new GitLab users still
                # need admin approval unless pre-created (see README).
                gitlab_rails['omniauth_enabled'] = true
                gitlab_rails['omniauth_allow_single_sign_on'] = ['openid_connect']
                gitlab_rails['omniauth_block_auto_created_users'] = true
                gitlab_rails['omniauth_auto_link_user'] = ['openid_connect']
                gitlab_rails['omniauth_providers'] = [
                  {
                    name: 'openid_connect',
                    label: 'geekstyle (Google)',
                    args: {
                      name: 'openid_connect',
                      scope: ['openid', 'profile', 'email'],
                      response_type: 'code',
                      issuer: 'https://auth.geekstyle.net',
                      discovery: true,
                      client_auth_method: 'basic',
                      uid_field: 'sub',
                      pkce: true,
                      client_options: {
                        identifier: ENV['ZITADEL_GITLAB_CLIENT_ID'],
                        secret: ENV['ZITADEL_GITLAB_CLIENT_SECRET'],
                        redirect_uri: 'https://scm.geekstyle.net/users/auth/openid_connect/callback'
                      }
                    }
                  }
                ]
                # GitLab Pages at https://pages.geekstyle.net/<namespace>/<project>/ (namespace-in-path:
                # no <ns>.pages wildcard — Cloudflare's free cert only covers one level). Same TLS-at-Cloudflare
                # setup as GitLab itself: Pages nginx listens on :80 by server_name, ingress-nginx routes the host.
                pages_external_url 'https://pages.geekstyle.net'
                gitlab_pages['enable'] = true
                gitlab_pages['namespace_in_path'] = true
                gitlab_pages['access_control'] = false
                pages_nginx['enable'] = true
                pages_nginx['listen_port'] = 80
                pages_nginx['listen_https'] = false
                pages_nginx['redirect_http_to_https'] = false
                pages_nginx['real_ip_header'] = 'CF-Connecting-IP'
                pages_nginx['real_ip_recursive'] = 'on'
                pages_nginx['real_ip_trusted_addresses'] = ['10.42.0.0/16', 'fd10:42::/56']
                # Tune for homelab — reduce worker counts
                puma['worker_processes'] = 2
                sidekiq['concurrency'] = 5
                prometheus_monitoring['enable'] = false
          # ZITADEL_GITLAB_CLIENT_ID / _SECRET (created by hand, never committed):
          #   kubectl -n gitlab create secret generic gitlab-oidc \
          #     --from-literal=ZITADEL_GITLAB_CLIENT_ID=<id> --from-literal=ZITADEL_GITLAB_CLIENT_SECRET=<secret>
          envFrom:
            - secretRef:
                name: gitlab-oidc
          resources:
            requests:
              cpu: 500m
              memory: 3Gi
            limits:
              cpu: 4000m
              memory: 10Gi
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 10
          volumeMounts:
            - name: gitlab-data
              mountPath: /etc/gitlab
              subPath: config
            - name: gitlab-data
              mountPath: /var/log/gitlab
              subPath: logs
            - name: gitlab-data
              mountPath: /var/opt/gitlab
              subPath: data
      volumes:
        - name: gitlab-data
          persistentVolumeClaim:
            claimName: gitlab-data
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  selector:
    app: gitlab
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
    - name: ssh
      port: 2222
      targetPort: 22
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlab
  namespace: gitlab
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    # Reached through the Cloudflare Tunnel (TLS at Cloudflare). Cloudflare's free plan caps
    # request bodies at 100 MB — bigger pushes/LFS must go over LAN/netbird.
spec:
  ingressClassName: nginx
  rules:
    # gitlab.geekstyle.net retired 2026-09-27
    - host: scm.geekstyle.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitlab
                port:
                  number: 80
    # GitLab Pages (served by the same pod's Pages nginx on :80)
    - host: pages.geekstyle.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitlab
                port:
                  number: 80
