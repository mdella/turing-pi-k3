# Git over SSH on the LAN (and netbird for IPv4): git.geekstyle.net → GitLab's sshd (container port 22), 2026-10-24.
#   IPv4 192.168.4.211  ·  IPv6 fd00:14::cafe:200 (VLAN 14 ULA, own pool below; since 2026-11-09). Clone URLs:
#   git@git.geekstyle.net:<group>/<project>.git (gitlab.yaml sets gitlab_ssh_host + port 22).
#
# From the internet (IPv6 only, Starlink CGNAT on IPv4): OPNsense port-forwards <VLAN 14 /64>::cafe:200 port 22 (alias
# git_ssh_v6, dynamic IPv6 host on BLUE_V14, follows the Starlink prefix) to fd00:14::cafe:200; WAN rule 210 passes
# git_ssh_ula. So nothing here changes with the prefix; only the public Cloudflare AAAA record has to follow it, which
# CronJob ddns/git-aaaa-ddns does (k3s-gitops manifests/git-aaaa-ddns; gitlab/README.md "Git over SSH").
# DNS: Cloudflare DNS-only A/AAAA (public address) + OPNsense Unbound host overrides (ULA). README "Git over SSH",
# network/README.md "Internal IPv6 on ULAs".
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata: { name: git-ssh, namespace: metallb-system }
spec:
  # MetalLB gives a dual-stack Service both IPs from ONE pool, so .211 lives here too; default-pool was split around it
  # (192.168.4.200-210 + 212-220 + fd00::200-220; backup of the old spec: ~/metallb-default-pool-backup-20261024.yaml on node1).
  addresses: ["192.168.4.211/32", "fd00:14::cafe:200/128"]
  autoAssign: false            # only for gitlab-ssh, by explicit request
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata: { name: git-ssh, namespace: metallb-system }
spec:
  ipAddressPools: [git-ssh]
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-ssh
  namespace: gitlab
  annotations:
    metallb.io/loadBalancerIPs: "192.168.4.211,fd00:14::cafe:200"
spec:
  type: LoadBalancer
  ipFamilyPolicy: RequireDualStack
  ipFamilies: [IPv4, IPv6]
  externalTrafficPolicy: Local   # keep the client's real IP in GitLab's SSH logs (pod is pinned to node1)
  selector:
    app: gitlab
  ports:
    - name: ssh
      port: 22
      targetPort: 22
