gitlabUrl: http://gitlab.gitlab.svc.cluster.local
rbac:
  create: true
runners:
  executor: kubernetes
  privileged: false
  # All nodes are ARM64 (RK1). Without the arch node_selector the kubernetes executor
  # requests the x86_64 helper image and every job fails with ImagePullBackOff.
  # The selector makes the runner pick the arm64 helper and schedule job pods on arm64 nodes.
  # clone_url: jobs clone via the in-cluster service instead of GitLab's external_url
  # (https://scm.geekstyle.net), which would route every clone out through Cloudflare
  # and back (100 MB body cap). Originally required because the old external_url,
  # gitlab.geekstyle.net, didn't resolve in-cluster; scm.geekstyle.net does.
  config: |
    [[runners]]
      clone_url = "http://gitlab.gitlab.svc.cluster.local"
      [runners.kubernetes]
        namespace = "{{ default .Release.Namespace .Values.runners.jobNamespace }}"
        image = "alpine"
        [runners.kubernetes.node_selector]
          "kubernetes.io/arch" = "arm64"
serviceAccount:
  create: true
# runnerToken: set at install time — do not commit the token value
# Upgrade (keeps the token): helm upgrade gitlab-runner gitlab/gitlab-runner -n gitlab \
#   --version <chart> --reset-then-reuse-values -f gitlab-runner-values.yaml
# Chart 0.93.0 ships runner 19.4.0; pin the newest 19.4 patch (19.4.3, 2026-10-30: base images 0.0.58/0.59 = the
# CVE-2026-111943 eMudhra CA distrust that GitLab ships as runner 19.5.1; 19.4.1 had a Kubernetes executor fix). Keep the runner's
# minor version <= GitLab's (19.4); move to chart 0.94.x / runner 19.5 only together with GitLab 19.5.
image:
  registry: registry.gitlab.com
  image: gitlab-org/gitlab-runner
  tag: alpine-v19.4.3
