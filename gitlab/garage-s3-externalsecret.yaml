# Garage S3 (on the NAS, see ../garage/README.md) credentials for GitLab LFS + backups.
# Source of truth: OpenBao secret/k8s/gitlab/garage-s3 (written 2026-11-01).
# ESO creates/owns the Kubernetes Secret gitlab/garage-s3 with every field of that path:
#   endpoint, region, lfs_bucket, lfs_access_key_id, lfs_secret_access_key,
#   backup_bucket, backup_access_key_id, backup_secret_access_key
# Not used by the GitLab pod yet (LFS / backup switch-over is a separate change).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-s3
  namespace: gitlab
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: garage-s3
    creationPolicy: Owner
  dataFrom:
    - extract: { key: k8s/gitlab/garage-s3 }
