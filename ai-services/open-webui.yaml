---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: ai-services
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ai-services
spec:
  replicas: 1
  # Recreate: SQLite on a RWO volume — never two pods at once
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      # Keep Open WebUI off node4 so Ollama/RKLLaMA get undivided RAM
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - k3-node4
      containers:
        - name: open-webui
          # Pinned (was the floating :main tag): v0.9.5 digest as running on 2026-09-30.
          # Upgrade deliberately — Open WebUI runs DB migrations on start (back up webui.db first).
          image: ghcr.io/open-webui/open-webui@sha256:74093dadc9c6aabc23987a74fd8c2fb8d995b1a5b22e83b0036fb9d6af590e8c
          ports:
            - name: http
              containerPort: 8080
          env:
            # Use LiteLLM as the OpenAI-compatible backend — exposes all models
            # (deepseek-coder:1.3b-npu, qwen2.5-coder:3b-npu, qwen2.5-coder:3b)
            - name: OPENAI_API_BASE_URL
              value: http://litellm.ai-services.svc.cluster.local:4000/v1
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secret
                  key: LITELLM_MASTER_KEY
            # Disable direct Ollama connection — everything goes through LiteLLM
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: DEFAULT_MODELS
              value: "deepseek-coder:1.3b-npu"
            # Login required (was "false" = no auth, everyone admin). SSO only, via Zitadel
            # (auth.geekstyle.net → Google); Zitadel only issues tokens to users with a
            # role in project "homelab". Client id/secret + WEBUI_SECRET_KEY: Secret open-webui-oidc.
            - name: WEBUI_AUTH
              value: "true"
            - name: WEBUI_URL
              value: http://chat.geekstyle.net
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
            - name: OAUTH_PROVIDER_NAME
              value: geekstyle (Google)
            - name: OPENID_PROVIDER_URL
              value: https://auth.geekstyle.net/.well-known/openid-configuration
            - name: OPENID_REDIRECT_URI
              value: http://chat.geekstyle.net/oauth/oidc/callback
            - name: OAUTH_SCOPES
              value: openid email profile
            - name: ENABLE_LOGIN_FORM
              value: "false"
            - name: DEFAULT_USER_ROLE
              value: user
          envFrom:
            - secretRef:
                name: open-webui-oidc
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1536Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ai-services
spec:
  selector:
    app: open-webui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  namespace: ai-services
  annotations:
    # Generous timeout — first response from NPU models can take 30-60s
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # Uncomment for TLS once DNS + NAT are set up:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: chat.geekstyle.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  number: 8080
  # tls:
  #   - hosts:
  #       - chat.geekstyle.net
  #     secretName: chat-tls
