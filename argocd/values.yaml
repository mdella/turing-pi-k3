# helm upgrade --install argocd argo/argo-cd -n argocd --create-namespace --version 10.11.6 -f values.yaml -f ~/k3s-gitops/argocd/values-private.yaml
# Chart 10.11.6 ships v3.5.6; the image is overridden to the v3.5.9 security release (2026-11-27). No 3.5.9 chart exists (10.12+ = 3.6).
global:
  domain: argocd.geekstyle.net
  image:
    tag: v3.5.9@sha256:3b7416d6a448f3cb9c445fb72f90b4f76be204f4541cd146115e53c8534a8d5a
  # Holds cluster-admin: stay off node3/node4 (NetworkPolicy not enforced there), and off node1 (GitLab's memory peak).
  nodeSelector:
    kubernetes.io/hostname: k3-node2

configs:
  cm:
    admin.enabled: false    # Zitadel SSO only; set true with a Helm upgrade to break glass
  params:
    server.insecure: true   # TLS ends at ingress-nginx

dex:
  enabled: false            # SSO will talk to Zitadel directly
notifications:
  enabled: false

controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
server:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  # LAN/netbird only: DNS-only A record to the private ingress IP, no tunnel rule.
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-dns01
    tls: true
repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 1Gi}
applicationSet:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
redis:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
