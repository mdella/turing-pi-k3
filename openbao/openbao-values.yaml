server:
  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: local-path
  ha:
    enabled: true
    raft:
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          # Allow Prometheus to scrape metrics without a token
          telemetry {
            unauthenticated_metrics_access = true
          }
        }

        storage "raft" {
          path = "/openbao/data"

          retry_join {
            leader_api_addr = "http://openbao-0.openbao-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://openbao-1.openbao-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://openbao-2.openbao-internal:8200"
          }
        }

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }

        service_registration "kubernetes" {}
        # Auto-unseal (2026-10-05): static AES-256 key from Secret openbao/openbao-static-seal
        # (mounted below). Re-initialised with recovery keys (5 shares / threshold 3) after the
        # original Shamir unseal keys were lost. Keep the seal key AND the recovery keys off-site:
        # without the seal key the data cannot be decrypted.
        seal "static" {
          current_key_id = "bao-static-20261005"
          current_key    = "file:///openbao/seal/key"
        }
      enabled: true
      setNodeId: true
  image:
    repository: openbao/openbao
    tag: 2.7.1
  replicas: 3
  volumes:
    - name: static-seal
      secret:
        secretName: openbao-static-seal
        defaultMode: 0400
  volumeMounts:
    - name: static-seal
      mountPath: /openbao/seal
      readOnly: true
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
ui:
  enabled: true
  serviceType: ClusterIP
