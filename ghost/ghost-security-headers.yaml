# Security headers ConfigMap for Ghost ingress
# UNUSED: nothing references it (ghost-ingress.yaml has no custom-headers annotation). Headers are applied
# globally via ingress-nginx/ingress-nginx-custom-response-headers. See README "Security Headers".
apiVersion: v1
kind: ConfigMap
metadata:
  name: ghost-security-headers
  namespace: ghost
data:
  X-Content-Type-Options: "nosniff"
  X-Frame-Options: "SAMEORIGIN"
  X-XSS-Protection: "1; mode=block"
  Referrer-Policy: "strict-origin-when-cross-origin"
