# Ghost ingress — blog.geekstyle.net
# TLS terminates at Cloudflare (Cloudflare Tunnel → ingress-nginx → ghost); no tls block or cert-manager needed.
# Security headers are global, from the ingress-nginx add-headers ConfigMap
# (ingress-nginx/ingress-nginx-custom-response-headers), not from annotations here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ghost
  namespace: ghost
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: blog.geekstyle.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ghost
                port:
                  name: http
